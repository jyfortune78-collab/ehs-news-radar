# 매일 아침 한국시간 07:30 에 뉴스를 자동 갱신하는 워크플로
# (GitHub 서버 사정에 따라 수 분~수십 분 늦게 실행될 수 있음)
name: update-news
on:
  schedule:
    - cron: "30 22 * * *"   # UTC 22:30 = 한국시간(KST) 다음날 07:30
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_news.py
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "뉴스 자동 갱신" && git push)
